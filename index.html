<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Feelings Wheel</title>
  <meta name="description" content="Name what you feel: a fast, accessible feelings wheel that works offline.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121114" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
  <main id="app" data-mode="overview">
    <fw-path></fw-path>
    <div id="stage">
      <canvas id="wheel" aria-hidden="true"></canvas>
      <div id="a11y-tree"></div>
    </div>
    <fw-panel></fw-panel>
    <fw-toolbar></fw-toolbar>
    <div id="announcer" aria-live="polite" class="visually-hidden"></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
