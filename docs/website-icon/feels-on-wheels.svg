      <g stroke="#000" stroke-width="20">
        <line x1="256" y1="256" x2="256.00" y2="6.00"/>
        <line x1="256" y1="256" x2="503.98" y2="287.75"/>
        <line x1="256" y1="256" x2="358.98" y2="483.81"/>
        <line x1="256" y1="256" x2="220.74" y2="503.50"/>
        <line x1="256" y1="256" x2="10.22" y2="301.73"/>
        <line x1="256" y1="256" x2="77.98" y2="80.48"/>
      </g>
      <circle cx="256" cy="256" r="148.8" fill="none" stroke="#000" stroke-width="16"/>
    </mask>
  </defs>
  <rect width="512" height="512" mask="url(#m)"/>
</svg>
